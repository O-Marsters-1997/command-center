<table id="board" hx-get="/board" hx-trigger="every 5s" hx-swap="outerHTML">
  <tr>
    <th></th><th>state</th><th>ticket</th><th>task</th><th>stack</th>
    <th>checks</th><th>pr</th><th>elapsed</th><th>spend</th><th>verbs</th>
  </tr>
  
  
  
  <tr class="group-head" data-depth="0">
    <td>
      <input type="checkbox" form="launch" name="task" value="sandbox://CC-1"
        hx-get="/board?task=sandbox%3A%2F%2FCC-1" hx-push-url="/?task=sandbox%3A%2F%2FCC-1" hx-target="#board" hx-swap="outerHTML"></td>
    <td>
      <span class="pill pill-idle pill-ring">ready</span> · launch queued
    </td>
    <td>
      <button type="button" class="ticket-link" hx-get="/board?sel=sandbox%3A%2F%2FCC-1" hx-push-url="/?sel=sandbox%3A%2F%2FCC-1" hx-target="#board" hx-swap="outerHTML">#CC-1</button>
    </td>
    <td><div class="reason">no blockers</div>
      <div class="title">untitled</div>
    </td>
    <td>L1</td>
    <td>no checks
    </td>
    <td>no pr</td>
    <td>not started
    </td>
    <td>no spend
    </td>
    <td class="verbs-cell"></td>
  </tr>
  

  
  <tr data-depth="1">
    <td>
      <input type="checkbox" form="launch" name="task" value="sandbox://CC-2"
        hx-get="/board?task=sandbox%3A%2F%2FCC-2" hx-push-url="/?task=sandbox%3A%2F%2FCC-2" hx-target="#board" hx-swap="outerHTML"></td>
    <td>
      <span class="pill pill-wait pill-ring">blocked</span>
    </td>
    <td>
      <button type="button" class="ticket-link" hx-get="/board?sel=sandbox%3A%2F%2FCC-2" hx-push-url="/?sel=sandbox%3A%2F%2FCC-2" hx-target="#board" hx-swap="outerHTML">#CC-2</button>
    </td>
    <td><div class="reason">blocked by sandbox://CC-1: cc-1-first has no open or merged pull request</div>
      <div class="title">untitled</div>
    </td>
    <td>L1</td>
    <td>no checks
    </td>
    <td>no pr</td>
    <td>not started
    </td>
    <td>no spend
    </td>
    <td class="verbs-cell"></td>
  </tr>
  

  
  
</table>
