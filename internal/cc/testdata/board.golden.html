<table id="board" hx-get="/board" hx-trigger="every 5s" hx-swap="outerHTML">
  <tr>
    <th></th><th>state</th><th>ref</th><th>ticket</th><th>stack</th>
    <th>checks</th><th>pr</th><th>elapsed</th><th>spend</th><th>verbs</th>
  </tr>
  
  
  
  <tr class="group group-head bg-[color-mix(in_oklab,var(--color-border)_40%,var(--color-bg))] text-muted" data-depth="0">
    <td>
      <input type="checkbox" form="launch" name="ticket" value="sandbox://CC-1"
        hx-get="/board?ticket=sandbox%3A%2F%2FCC-1" hx-push-url="/?ticket=sandbox%3A%2F%2FCC-1" hx-target="#board" hx-swap="outerHTML"></td>
    <td>
      <span class="pill pill-idle pill-ring">ready</span> · launch queued
    </td>
    <td>
      <button type="button" class="border-none bg-transparent p-0 text-inherit underline underline-offset-2" hx-get="/board?sel=sandbox%3A%2F%2FCC-1" hx-push-url="/?sel=sandbox%3A%2F%2FCC-1" hx-target="#board" hx-swap="outerHTML">#CC-1</button>
    </td>
    <td><div class="text-muted text-[0.85em]">no blockers</div>
      <div>untitled</div>
    </td>
    <td>L1</td>
    <td>no checks
    </td>
    <td>no pr</td>
    <td>not started
    </td>
    <td>no spend
    </td>
    <td class="opacity-35 transition-[opacity] duration-[120ms] ease-[ease-in-out] motion-reduce:transition-none group-hover:opacity-100 group-focus-within:opacity-100 group-[.selected]:opacity-100"></td>
  </tr>
  

  
  <tr class="group" data-depth="1">
    <td>
      <input type="checkbox" form="launch" name="ticket" value="sandbox://CC-2"
        hx-get="/board?ticket=sandbox%3A%2F%2FCC-2" hx-push-url="/?ticket=sandbox%3A%2F%2FCC-2" hx-target="#board" hx-swap="outerHTML"></td>
    <td>
      <span class="pill pill-wait pill-ring">blocked</span>
    </td>
    <td>
      <button type="button" class="border-none bg-transparent p-0 text-inherit underline underline-offset-2" hx-get="/board?sel=sandbox%3A%2F%2FCC-2" hx-push-url="/?sel=sandbox%3A%2F%2FCC-2" hx-target="#board" hx-swap="outerHTML">#CC-2</button>
    </td>
    <td><div class="text-muted text-[0.85em]">blocked by sandbox://CC-1: cc-1-first has no open or merged pull request</div>
      <div>untitled</div>
    </td>
    <td>L1</td>
    <td>no checks
    </td>
    <td>no pr</td>
    <td>not started
    </td>
    <td>no spend
    </td>
    <td class="opacity-35 transition-[opacity] duration-[120ms] ease-[ease-in-out] motion-reduce:transition-none group-hover:opacity-100 group-focus-within:opacity-100 group-[.selected]:opacity-100"></td>
  </tr>
  

  
  
</table>
