<table id="board" hx-get="/board" hx-trigger="every 5s" hx-swap="outerHTML">
  <colgroup>
    <col class="w-8"><col class="w-40"><col class="w-16"><col><col class="w-20">
    <col class="w-24"><col class="w-20"><col class="w-24"><col class="w-20"><col class="w-28">
  </colgroup>
  <tr class="text-xs font-semibold uppercase tracking-wide text-muted">
    <th></th><th>state</th><th>ticket</th><th>task</th><th>stack</th>
    <th>checks</th><th>pr</th><th>elapsed</th><th>spend</th><th>verbs</th>
  </tr>
  
  
  
  <tr class="group group-head bg-[color-mix(in_oklab,var(--color-border)_40%,var(--color-bg))] text-muted" data-depth="0">
    <td class="px-2 py-2 text-center">
      <input type="checkbox" form="launch" name="task" value="sandbox://CC-1"
        hx-get="/board?task=sandbox%3A%2F%2FCC-1" hx-push-url="/?task=sandbox%3A%2F%2FCC-1" hx-target="#board" hx-swap="outerHTML"></td>
    <td class="px-3 py-2">
      <div class="flex flex-wrap items-center gap-1">
      <span class="pill pill-idle pill-ring">ready</span> <span class="text-xs text-muted">· launch queued</span>
      </div>
    </td>
    <td class="px-3 py-2">
      <button type="button" class="border-none bg-transparent p-0 font-semibold text-inherit underline underline-offset-2" hx-get="/board?sel=sandbox%3A%2F%2FCC-1" hx-push-url="/?sel=sandbox%3A%2F%2FCC-1" hx-target="#board" hx-swap="outerHTML">#CC-1</button>
    </td>
    <td class="px-3 py-2 break-words"><div class="mb-0.5 text-xs text-muted">no blockers</div>
      <div>untitled</div>
    </td>
    <td class="px-3 py-2 break-words text-xs">L1</td>
    <td class="px-3 py-2"><span class="text-xs text-muted">no checks</span>
    </td>
    <td class="px-3 py-2 text-xs"><span class="text-muted">no pr</span></td>
    <td class="px-3 py-2"><span class="text-xs text-muted">not started</span>
    </td>
    <td class="px-3 py-2 break-words text-xs"><span class="text-muted">no spend</span>
    </td>
    <td class="flex flex-col items-start gap-1 px-3 py-2 opacity-35 transition-[opacity] duration-[120ms] ease-[ease-in-out] motion-reduce:transition-none group-hover:opacity-100 group-focus-within:opacity-100 group-[.selected]:opacity-100"></td>
  </tr>
  

  
  <tr class="group" data-depth="1">
    <td class="px-2 py-2 text-center">
      <input type="checkbox" form="launch" name="task" value="sandbox://CC-2"
        hx-get="/board?task=sandbox%3A%2F%2FCC-2" hx-push-url="/?task=sandbox%3A%2F%2FCC-2" hx-target="#board" hx-swap="outerHTML"></td>
    <td class="px-3 py-2">
      <div class="flex flex-wrap items-center gap-1">
      <span class="pill pill-wait pill-ring">blocked</span>
      </div>
    </td>
    <td class="px-3 py-2">
      <button type="button" class="border-none bg-transparent p-0 font-semibold text-inherit underline underline-offset-2" hx-get="/board?sel=sandbox%3A%2F%2FCC-2" hx-push-url="/?sel=sandbox%3A%2F%2FCC-2" hx-target="#board" hx-swap="outerHTML">#CC-2</button>
    </td>
    <td class="px-3 py-2 break-words"><div class="mb-0.5 text-xs text-muted">blocked by sandbox://CC-1: cc-1-first has no open or merged pull request</div>
      <div>untitled</div>
    </td>
    <td class="px-3 py-2 break-words text-xs">L1</td>
    <td class="px-3 py-2"><span class="text-xs text-muted">no checks</span>
    </td>
    <td class="px-3 py-2 text-xs"><span class="text-muted">no pr</span></td>
    <td class="px-3 py-2"><span class="text-xs text-muted">not started</span>
    </td>
    <td class="px-3 py-2 break-words text-xs"><span class="text-muted">no spend</span>
    </td>
    <td class="flex flex-col items-start gap-1 px-3 py-2 opacity-35 transition-[opacity] duration-[120ms] ease-[ease-in-out] motion-reduce:transition-none group-hover:opacity-100 group-focus-within:opacity-100 group-[.selected]:opacity-100"></td>
  </tr>
  

  
  
</table>
