<section id="repo-banner" class="banner ribbon mb-3" data-glyph="failed" data-state="refused" role="status">

    <li><span class="glyph glyph-ready">clone</span> <span class="text-muted">ready</span></li>

    <li><span class="glyph glyph-ready">settings file</span> <span class="text-muted">ready</span></li>
    </ul>
  <form class="mt-1" hx-post="/repos/track" hx-target="#repo-banner" hx-swap="outerHTML" method="post" action="/repos/track">

    <button type="submit" class="btn btn-primary">Track again</button>
  </form>
  </section>
