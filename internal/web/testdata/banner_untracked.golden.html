<section id="repo-banner" class="banner ribbon mb-3" data-glyph="ready" data-state="untracked" role="status">
  <p>Not tracked.</p>
  <ul class="flex flex-wrap gap-3 mt-1">
    <li><span class="glyph glyph-ready">clone</span> <span class="text-muted">ready</span></li>
    <li><span class="glyph glyph-ready">squash-only merges</span> <span class="text-muted">ready</span></li>
    <li><span class="glyph glyph-ready">default branch is main</span> <span class="text-muted">ready</span></li>
    <li><span class="glyph glyph-ready">settings file</span> <span class="text-muted">ready</span></li>
    </ul>
  <form class="mt-1" hx-post="/repos/track" hx-target="#repo-banner" hx-swap="outerHTML" method="post" action="/repos/track">
    <input type="hidden" name="repo" value="acme/unknown">
    <button type="submit" class="btn btn-primary">Track</button>
  </form>
  </section>
