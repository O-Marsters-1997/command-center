<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Centre</title>
<link rel="stylesheet" href="/assets/app.css">
<script>
  
  
  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + "s ago";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m" + (s % 60 ? (s % 60) + "s" : "") + " ago";
    var h = Math.floor(m / 60);
    return h + "h" + (m % 60 ? (m % 60) + "m" : "") + " ago";
  }
  setInterval(function () {
    var now = Date.now();
    document.querySelectorAll("time[datetime]").forEach(function (el) {
      var at = Date.parse(el.dateTime);
      if (!isNaN(at)) el.textContent = ago(now - at);
    });
  }, 1000);
</script>
<script>
  function markCurrent() {
    document.querySelectorAll(".sidebar-item").forEach(function (a) {
      var here = a.pathname === "/" ? location.pathname === "/" : location.pathname.indexOf(a.pathname) === 0;
      if (here) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }
  document.addEventListener("htmx:pushedIntoHistory", markCurrent);
  document.addEventListener("htmx:historyRestore", markCurrent);
</script>
<script src="/assets/htmx.min.js"></script>
<script src="/assets/sse.min.js"></script>
<script>
  document.addEventListener("htmx:sseMessage", function (e) {
    var pre = e.target;
    while (pre.childElementCount > 1000) pre.firstElementChild.remove();
  });
</script>
</head>
<body>
<a class="absolute left-[-100vw] px-[0.6rem] py-[0.35rem] bg-surface focus:left-2 focus:top-2" href="#main">skip to content</a>
<div class="app">
<aside class="sidebar" id="sidebar" aria-label="sections">
  <div class="sidebar-head">Command Centre</div>
  <nav class="sidebar-nav">
    <a class="sidebar-item" href="/?view=board" hx-get="/?view=board" hx-select="#main" hx-target="#main" hx-swap="outerHTML" hx-push-url="true" aria-current="page"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><line x1="1.5" y1="6" x2="14.5" y2="6"/><line x1="6" y1="6" x2="6" y2="13.5"/></svg><span>All tickets</span></a>
    <a class="sidebar-item" href="/insights" hx-get="/insights" hx-select="#main" hx-target="#main" hx-swap="outerHTML" hx-push-url="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 2v11.5h12" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 11V8M8 11V5.5M11.5 11V7" stroke-linecap="round"/></svg><span>Insights</span></a>
    <a class="sidebar-item" href="/features" hx-get="/features" hx-select="#main" hx-target="#main" hx-swap="outerHTML" hx-push-url="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 2h6l6 6-6.5 6.5L2 8.5V2Z" stroke-linejoin="round"/><circle cx="5.5" cy="5.5" r="1" fill="currentColor" stroke="none"/></svg><span>Repos</span></a>
  </nav>
  <div class="rail-slot" id="rail"></div>
  <form method="post" action="/logout">
    <button type="submit" class="sidebar-item w-full border-0 bg-transparent text-left">log out</button>
  </form>
</aside>
<div class="pane">

<main id="main" data-home>
<header class="topbar">
  <a class="back" href="/" hx-get="/" hx-select="#main" hx-target="#main" hx-swap="outerHTML" hx-push-url="true">&lsaquo; Back</a>
  <ol class="crumbs">
<li>Command Centre</li>
<li><a href="/features">repos</a></li>


</ol>
  <div class="topbar-action">
<a href="/?view=graph">graph</a>

</div>
</header>
<div class="content">



<form id="launch" method="post" action="/launch/open" hx-post="/launch/open" hx-target="#launch-modal" hx-swap="innerHTML"></form>

<button type="submit" form="launch">launch selected</button>

<div id="launch-modal"></div>
</div>
</main>
</div>
</div>
</body>
</html>
