# cc-config prepends `port = 0`, so this file must not set it.
# {{agents}} is substituted by cc-config with the repo's testdata/agents directory.
#
# CC-7 is the same ticket teardown-cc7-empty.toml's group already imported -- re-importing it
# upserts the existing row rather than minting a second one, and only the shared agent_command
# actually changes underneath it. CC-1/CC-3/CC-4 arrive fresh, under the group's own second
# import.

max_agents = 5
agent_command = ["{{agents}}/commits.sh", "{worktree}", "{settings}", "{prompt_file}"]

[[repo]]
name     = "repo"
remote   = "https://github.com/sandbox-org/teardown"
stacking = false
