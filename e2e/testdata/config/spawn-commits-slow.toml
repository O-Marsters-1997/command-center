# cc-config prepends `port = 0`, so this file must not set it.
# {{agents}} is substituted by cc-config with the repo's testdata/agents directory.
#
# One of the four spawn-*.toml fixtures spawn_and_dispose.txtar swaps between. CC-1/2/3 are
# imported once, under whichever of the four is loaded first -- the only thing that changes
# underneath them across a swap is agent_command. commits_slow.sh's full-second sleep, unlike
# empty.sh's near-instant exit, is long enough that CC-3's own explore run can never dispose
# within the same tick it was spawned in, which the config swap to spawn-sleeps.toml depends on.

max_agents = 3
agent_command = ["{{agents}}/commits_slow.sh", "{worktree}", "{settings}", "{prompt_file}"]

[[repo]]
name     = "repo"
remote   = "https://github.com/sandbox-org/spawn"
stacking = false
