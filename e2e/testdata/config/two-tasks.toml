# cc-config prepends `port = 0`, so this file must not set it.
# {{agents}} is substituted by cc-config with the repo's testdata/agents directory.

max_agents = 1
agent_command = ["{{agents}}/empty.sh", "{worktree}", "{settings}", "{prompt_file}", "--agents", "{agents}", "--append-system-prompt-file", "{system_prompt}", "--permission-mode", "auto", "--model", "{model}"]

[[repo]]
name     = "repo"
remote   = "https://github.com/sandbox-org/two-tasks"
stacking = false
