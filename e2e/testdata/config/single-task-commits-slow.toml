# cc-config prepends `port = 0`, so this file must not set it.
# {{agents}} is substituted by cc-config with the repo's testdata/agents directory.
#
# commits_slow.sh's full-second sleep, unlike commits.sh's, is long enough that a launch's own
# explore run can never dispose within the same tick it was spawned in -- crash_recovery.txtar's
# own config swap depends on that separation.

max_agents = 1
agent_command = ["{{agents}}/commits_slow.sh", "{worktree}", "{settings}", "{prompt_file}"]

[[repo]]
name     = "repo"
remote   = "https://github.com/sandbox-org/single-task"
stacking = false
