# cc-config prepends `port = 0`, so this file must not set it.
# {{agents}} is substituted by cc-config with the repo's testdata/agents directory.
#
# Re-declares fan-out-stacked-capped.toml's same five tickets under sleeps.sh in place of
# commits.sh, so a dependent's launch is observable as running before it is killed -- proving
# max_agents defers the surplus rather than inferring it from how fast an agent happens to exit.

max_agents = 2
agent_command = ["{{agents}}/sleeps.sh", "{worktree}", "{settings}", "{prompt_file}"]

[[repo]]
name     = "repo"
remote   = "https://github.com/sandbox-org/fan-out"
stacking = true
