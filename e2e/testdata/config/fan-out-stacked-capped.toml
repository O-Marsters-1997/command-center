# cc-config prepends `port = 0`, so this file must not set it.
# {{agents}} is substituted by cc-config with the repo's testdata/agents directory.
#
# The same 1+4 fan-out as fan-out-stacked.toml, but max_agents can only ever cover two of the
# four dependents at once -- issue #33's "waiting for a slot, not a base" proof.

max_agents = 2
agent_command = ["{{agents}}/commits.sh", "{worktree}", "{settings}", "{prompt_file}"]

[[task]]
ticket_url = "sandbox://CC-1"
repo       = "repo"
branch     = "cc-1"
blocked_by = []

[[task]]
ticket_url = "sandbox://CC-2"
repo       = "repo"
branch     = "cc-2"
blocked_by = ["sandbox://CC-1"]

[[task]]
ticket_url = "sandbox://CC-3"
repo       = "repo"
branch     = "cc-3"
blocked_by = ["sandbox://CC-1"]

[[task]]
ticket_url = "sandbox://CC-4"
repo       = "repo"
branch     = "cc-4"
blocked_by = ["sandbox://CC-1"]

[[task]]
ticket_url = "sandbox://CC-5"
repo       = "repo"
branch     = "cc-5"
blocked_by = ["sandbox://CC-1"]

[[repo]]
name     = "repo"
path     = "../repo"
stacking = true
