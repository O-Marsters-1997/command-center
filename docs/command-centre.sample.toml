# A runnable sample config, pointed at this repository.
#
# The real config lives at <workspace>/.claude/command-centre.toml, which .gitignore excludes,
# so this is the copy a reviewer can run:
#
#   just run --config docs/command-centre.sample.toml
#
# The two branch names below are invented and have no pull requests, so the page renders CC-1
# as "ready" and CC-2 as "blocked" naming CC-1 — truthfully, off real gh output.

max_agents = 1
port       = 7777

[[task]]
ticket_url = "sandbox://CC-1"
repo       = "command-center"
branch     = "cc-sample-first"
blocked_by = []

[[task]]
ticket_url = "sandbox://CC-2"
repo       = "command-center"
branch     = "cc-sample-second"
blocked_by = ["sandbox://CC-1"]

[[repo]]
name     = "command-center"
path     = "."             # relative to the workspace root: the directory holding docs/
stacking = false           # Phase 2 flips it
