# A runnable sample config, pointed at this repository.
#
# This is the copy a reviewer can run:
#
#   just run --config docs/command-centre.sample.toml
#
# Where the config file sits decides nothing except what a relative [[repo]] path is relative
# to. Where the database, run logs and checkouts live is data_dir's job, below.
#
# This sample carries no tickets: label an issue `project:<name>` on GitHub, then browse what's
# importable at GET /features. Stacking is on, so a dependent cuts and pushes off its blocker's
# own branch rather than main once the blocker's PR opens.

# Where the app keeps everything except the database: state/ for the lock, run logs and agent
# settings, repos/ for checkouts. Absent, CC_DATA_DIR answers; absent that,
# os.UserConfigDir()/command-centre.
# Commented out here so running the sample does not collide with a real instance's data.
# data_dir = "~/cc-sample-data"

# The Postgres the store runs on. Absent, CC_DATABASE_URL answers; absent that, the compose.yaml
# server in this repo, which `just up` starts.
# database_url = "postgres://cc:cc@localhost:5432/cc?sslmode=disable"

# Where the Claude CLI itself writes every session transcript, interactive and agent alike --
# what the spend fit reads to weigh a utilization window's actual cost. Absent, ~/.claude/projects.
# claude_projects_dir = "~/.claude/projects"

max_agents = 2
port       = 7777

# The default when this key is absent, written out so the model is visible in the file you read.
# {prompt} is the composed prompt and {settings} the app-owned deny file; the runner substitutes
# both into every argv element. Nothing spawns until a launch is authorised on the page.
agent_command = [
  "claude", "-p", "{prompt}",
  "--output-format", "stream-json", "--verbose",
  "--settings", "{settings}",
  "--agents", "{agents}",
  "--append-system-prompt-file", "{system_prompt}",
  "--permission-mode", "auto",
  "--model", "claude-sonnet-5",
]

# Caps a spawned run at this many agent turns, appended to agent_command as
# --max-turns <n>. Absent (the default) sets no cap, so a runaway run can eat
# an entire launch window.
# max_turns = 60

# A repo is located by exactly one of remote and path. path points at a checkout that already
# exists; remote is a git URL the app clones to <data_dir>/repos/<name>, which is what lets this
# same file run on a machine with no tree on it:
#
#   remote = "git@github.com:O-Marsters-1997/command-center.git"
[[repo]]
name     = "command-center"
path     = ".."            # relative to this file's own directory, docs/, so: the repo root
stacking = true

# Paths the build regenerates. When a conflict is confined to these paths, the app merges,
# runs build_command, stages and commits, then offers the row without agent involvement.
# Empty (default) means the repo opted out of generated-file auto-resolution.
generated = ["internal/web/assets/dist/**", "internal/web/testdata/*.golden.html"]

# Argv to regenerate the paths listed in generated. Runs in the worktree after a clean merge.
# Empty (default) means generated-file auto-resolution is off; provide one to enable it.
build_command = ["just", "assets"]
