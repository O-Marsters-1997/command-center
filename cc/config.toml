# The Command Centre's own config, tracked. Everything machine-specific is an environment
# variable, so this same file runs on a laptop and on a machine with no tree on it:
#
#   CC_DATA_DIR        where state/ and repos/ go. Default: os.UserConfigDir()/command-centre.
#   CC_DATABASE_URL    the Postgres to connect to. Default: the compose.yaml server.
#   CC_AGENT_COMMAND   a JSON array replacing agent_command, for a local wrapper.
#
# Run it with:
#
#   cc --config cc/config.toml
#
# The [[repo]] below is imported once, on the first boot against an empty repos table, as
# O-Marsters-1997/command-center, cloned to <data_dir>/repos/O-Marsters-1997/command-center.
# Every later boot refuses while it is still here, so delete it after that first boot. The fleet
# itself is no longer here: label an issue project:<name> and browse what's importable at
# GET /features.

max_agents = 3
port       = 7777

# {settings} is the app-owned deny file and {prompt} the composed prompt; the runner substitutes
# both into every argv element. The laptop's caffeinate and safehouse wrapper goes in
# CC_AGENT_COMMAND, not here.
agent_command = [
  "claude", "-p", "{prompt}",
  "--output-format", "stream-json", "--verbose",
  "--settings", "{settings}",
  "--agents", "{agents}",
  "--append-system-prompt-file", "{system_prompt}",
  "--permission-mode", "auto",
  "--model", "claude-sonnet-5-5",
]

[[repo]]
name     = "command-center"
remote   = "git@github.com:O-Marsters-1997/command-center.git"
