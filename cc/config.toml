# The Command Centre's own config, tracked. Everything machine-specific is an environment
# variable, so this same file runs on a laptop and on a machine with no tree on it:
#
#   CC_DATA_DIR        where state/ and repos/ go. Default: os.UserConfigDir()/command-centre.
#   CC_AGENT_COMMAND   a JSON array replacing agent_command, for a local wrapper.
#
# Run it with:
#
#   cc --config cc/config.toml
#
# The repo below is named by its remote, so startup clones it to <data_dir>/repos/command-center
# rather than expecting a directory someone made by hand. The fleet itself is no longer here:
# label an issue project:<name> and import its group from GET /import.

max_agents = 3
port       = 7777

# {settings} is the app-owned deny file and {prompt} the composed prompt; the runner substitutes
# both into every argv element. The laptop's caffeinate and safehouse wrapper goes in
# CC_AGENT_COMMAND, not here.
agent_command = [
  "claude", "-p", "{prompt}",
  "--output-format", "stream-json", "--verbose",
  "--settings", "{settings}",
  "--model", "claude-sonnet-5",
]

[[repo]]
name     = "command-center"
remote   = "git@github.com:O-Marsters-1997/command-center.git"
stacking = true
deny     = [".github/**", ".golangci.yml", "go.mod", "go.sum"]

  [[repo.checks.all_of]]
  success = "test (ubuntu-latest)"
  [[repo.checks.all_of]]
  success = "test (macos-latest)"
  [[repo.checks.all_of]]
  success = "e2e (ubuntu-latest)"
  [[repo.checks.all_of]]
  success = "e2e (macos-latest)"
  [[repo.checks.all_of]]
  success = "lint"
  [[repo.checks.all_of]]
  success = "build"
  [[repo.checks.all_of]]
  success = "tidy"
