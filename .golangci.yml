version: "2"

# Without the e2e tag the harness behind it is invisible to the linter and rots unlinted.
run:
  build-tags:
    - e2e

linters:
  default: none
  enable:
    - errcheck # unchecked errors
    - govet # vet checks
    - ineffassign # unused assignments
    - staticcheck # static analysis
    - unused # unused code
    - misspell # spelling
    - exhaustive # exhaustive enum switches
    - lll # line length
  settings:
    lll:
      line-length: 120
    exhaustive:
      default-signifies-exhaustive: true

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/O-Marsters-1997/command-center

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
