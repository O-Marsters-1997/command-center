version: "2"

# Without the e2e tag the harness behind it is invisible to the linter and rots unlinted.
run:
  build-tags:
    - e2e

linters:
  default: none
  enable:
    - errcheck # unchecked errors
    - govet # vet checks
    - ineffassign # unused assignments
    - staticcheck # static analysis
    - unused # unused code
    - misspell # spelling
    - exhaustive # exhaustive enum switches
    - lll # line length
    - errorlint # %w vs %v, and == comparisons on error values
    - thelper # test helpers call t.Helper()
    - tparallel # t.Parallel() used consistently between a test and its subtests
    - usetesting # t.Context(), t.TempDir(), t.Setenv() over manual equivalents
    - forbidigo # bans reflect.DeepEqual and time.Sleep in tests
    - depguard # plan stays pure, only store reaches ccdb, no testify
  settings:
    lll:
      line-length: 120
    exhaustive:
      ignore-enum-members: \.stateCount$
    usetesting:
      context-background: true
      context-todo: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^reflect\.DeepEqual$
          msg: compare fields with == and slices.Equal instead
        - pattern: ^time\.Sleep$
          msg: poll a condition with a deadline, or wait on a channel
        - pattern: ^log\.(Print|Fatal|Panic)
          msg: use the injected *slog.Logger, or return the error (log.* is allowed only in cmd/cc/main.go)
        - pattern: ^time\.Now$
          msg: take a loop.Clock and call Now on it (time.Now is allowed only in loop.RealClock)
        - pattern: ^(\*?errors\.errorString|\*?fmt\.wrapError|error)\.Error$
          msg: match errors with errors.Is/As, not by their text
    depguard:
      rules:
        plan-pure:
          files: ["**/internal/plan/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/O-Marsters-1997/command-center/internal/plan
            - github.com/O-Marsters-1997/command-center/internal/spend
            - github.com/O-Marsters-1997/command-center/internal/verdict
          deny:
            - pkg: database/sql
              desc: plan imports nothing impure; the store hands it a plan.Input (ADR 0013)
            - pkg: os/exec
              desc: plan imports nothing impure; the loop observes and passes facts in (ADR 0013)
            - pkg: net/http
              desc: plan imports nothing impure; the loop observes and passes facts in (ADR 0013)
        ccdb-in-store:
          files: ["$all", "!**/internal/store/**"]
          deny:
            - pkg: github.com/O-Marsters-1997/command-center/internal/store/ccdb
              desc: only internal/store uses the generated queries; call a Store method (ADR 0004)
        no-testify:
          files: ["**/*_test.go"]
          deny:
            - pkg: github.com/stretchr/testify
              desc: compare with == and slices.Equal, and match errors with errors.Is/As
  exclusions:
    rules:
      - path-except: _test\.go
        text: reflect\.DeepEqual|time\.Sleep|Error\b
        linters:
          - forbidigo
      - path: _test\.go
        text: time\.Now
        linters:
          - forbidigo
      - path: ^internal/loop/clock\.go$
        linters:
          - forbidigo
      - path: ^(cmd/cc/|e2e/|internal/(app|loop|demo|runner)/)
        text: time\.Now
        linters:
          - forbidigo
      - path: ^internal/(app|cctest|command|config|git)/.*_test\.go$
        text: Error
        linters:
          - forbidigo
      - path: ^internal/(agentlog/(parse|diff)|verdict/verdict|loop/checks_events|web/view/(logview|logline))\.go$
        linters:
          - exhaustive
      - path: ^internal/plan/(plan|compose|draftgate)\.go$
        linters:
          - exhaustive

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/O-Marsters-1997/command-center

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
