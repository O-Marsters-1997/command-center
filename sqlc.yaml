version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/store/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "ccdb"
        out: "internal/store/ccdb"
        rename:
          url: "URL"
          baseline_sha: "BaselineSHA"
          base_sha_at_push: "BaseSHAAtPush"
          token_sha: "TokenSHA"
        overrides:
          - db_type: "uuid"
            nullable: true
            go_type: "database/sql.NullString"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"
