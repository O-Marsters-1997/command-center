version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/store/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "ccdb"
        out: "internal/store/ccdb"
        rename:
          url: "URL"
          baseline_sha: "BaselineSHA"
          base_sha_at_push: "BaseSHAAtPush"
          token_sha: "TokenSHA"
          first_push_ci: "FirstPushCI"
