seed = 11
speed = 20

[[repo]]
name = "acme/api"
files = { "go.mod" = "module acme/api\n", "main.go" = "package main\n" }

[[ticket]]
id = "slow"
repo = "acme/api"
title = "Add the slow report"
feature = "ci"
agent = { after = "1m", result = "commits", files = ["slow.go"] }
ci = ["pass"]
ci_after = "2m"
merge = { after = "4m" }

[[ticket]]
id = "red"
repo = "acme/api"
title = "Add the red report"
feature = "ci"
agent = { after = "1m", result = "commits", files = ["red.go"] }
ci = ["fail"]
ci_after = "1m"

[[ticket]]
id = "hung"
repo = "acme/api"
title = "Add the hung report"
feature = "ci"
agent = { after = "1m", result = "commits", files = ["hung.go"] }
ci = ["hang"]

[[ticket]]
id = "dropped"
repo = "acme/api"
title = "Add the dropped report"
feature = "ci"
agent = { after = "1m", result = "commits", files = ["dropped.go"] }
ci = ["pass"]
close = { after = "2m" }

[[expect]]
at = "1m15s"
ticket = "slow"
state = "push_pending"

[[expect]]
at = "1m30s"
ticket = "slow"
state = "checking"

[[expect]]
at = "2m15s"
ticket = "red"
state = "ci_failed"

[[expect]]
at = "3m15s"
ticket = "dropped"
state = "pr_closed_unmerged"

[[expect]]
at = "4m"
ticket = "slow"
state = "review_me"

[[expect]]
at = "16m"
ticket = "hung"
state = "needs_you"
