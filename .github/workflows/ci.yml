name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # test and e2e are linux-only: GitHub's macOS runners have no Docker daemon, and the
  # alternative is a green tick over a suite that quietly skipped the store. build covers darwin.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: cc
          POSTGRES_DB: cc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cc -d cc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      CC_TEST_DATABASE_URL: postgres://cc:cc@localhost:5432/cc?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: cc
          POSTGRES_DB: cc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cc -d cc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      CC_TEST_DATABASE_URL: postgres://cc:cc@localhost:5432/cc?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags=e2e ./e2e/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/cc ./cmd/cc

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: git diff --exit-code internal/cc/assets/dist
